[project]
name = "flyhub-backend"
version = "0.1.0"
description = "API de gerenciamento de inspeções por drone conectadas ao FlightHub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "structlog>=24.4",
  "sse-starlette>=2.1",
  "opencv-python-headless>=4.10",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Inferência de verdade. Sem isto o detector roda em passthrough — ver
# `backend/requirements-vision.txt`.
vision = [
  "ultralytics>=8.3",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]
# `×` (U+00D7) é o separador de resolução em todo o caminho do vídeo, do
# MediaMTX à tela. Trocar por `x` faria a string do backend divergir do que o
# broker e o M4TD reportam.
allowed-confusables = ["×"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
