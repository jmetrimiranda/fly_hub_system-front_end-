server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA: qualquer rota desconhecida devolve o index.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # A API e o canal SSE ficam atrás do mesmo host — sem CORS em produção.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # SSE e o MJPEG de /flight/stream precisam de buffer desligado e timeout
    # longo: as duas são respostas que não terminam. Com buffering ligado o
    # vídeo chega em blocos e o SSE atrasa. Vale para tudo sob /api/.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }
}
