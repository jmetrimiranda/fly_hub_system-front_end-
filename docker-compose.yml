name: flyhub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyhub}
      POSTGRES_DB: ${POSTGRES_DB:-flyhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flyhub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file: [.env]
    # Repasse explícito, nunca valor fixo. O `env_file` acima é lido pelo Docker
    # UMA VEZ, quando o container é criado: editar o .env com o container de pé
    # não muda nada, e o sintoma é comportamento antigo sem erro nenhum. Já a
    # forma `${VAR:-padrao}` é interpolada pelo Compose a cada comando, lendo o
    # .env da raiz na hora — e a mudança de valor faz o `up -d` recriar o
    # container. O padrão é o que funciona no Compose puro, sem Dev Container:
    # MediaMTX no profile `stream`, dentro desta rede. Quem não tem .env sobe
    # igual; quem tem, manda.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flyhub}:${POSTGRES_PASSWORD:-flyhub}@db:5432/${POSTGRES_DB:-flyhub}
      # Aspas em todos: sem elas o YAML converte `1935` em número e `false` em
      # booleano, e um valor vazio vira `null` — que no Compose não significa
      # string vazia, e sim "herde do shell do host, ou omita".
      MEDIAMTX_API_URL: "${MEDIAMTX_API_URL:-http://mediamtx:9997}"
      MEDIAMTX_RTSP_URL: "${MEDIAMTX_RTSP_URL:-rtsp://mediamtx:8554}"
      FLIGHT_SOURCE: "${FLIGHT_SOURCE:-fake}"
      FLYHUB_RTMP_HOST: "${FLYHUB_RTMP_HOST:-mediamtx}"
      FLYHUB_RTMP_PORT: "${FLYHUB_RTMP_PORT:-1935}"
      FLYHUB_STREAM_PATH: "${FLYHUB_STREAM_PATH:-live/m4td}"
      # Vazio é valor válido: faz o endereço RTMP ser montado com o host do
      # próprio MediaMTX, como em `config.py`.
      FLYHUB_PUBLIC_HOST: "${FLYHUB_PUBLIC_HOST:-}"
      TUNNEL_ENABLED: "${TUNNEL_ENABLED:-false}"
      TUNNEL_PUBLIC_HOST: "${TUNNEL_PUBLIC_HOST:-}"
      # Aqui e não só no env_file: definir o segredo é justamente a mudança que
      # o operador faz com o container já de pé, e é a forma `${VAR:-}` que faz
      # o `up -d` recriá-lo. Vazio é válido — a aplicação sobe e recusa gravar
      # credencial do Roboflow, dizendo o motivo na tela.
      SECRET_KEY: "${SECRET_KEY:-}"
      # Onde o peso entregue é lido. O volume `./models` abaixo é o que faz
      # este caminho existir dentro do container. Ver models/README.md.
      MODELS_DIR: "${MODELS_DIR:-/models}"
      MODEL_WEIGHTS: "${MODEL_WEIGHTS:-/models/best.pt}"
    # O MediaMTX do M4TD roda no host, fora deste Compose. Em Linux o nome
    # `host.docker.internal` não existe por padrão — sem esta linha ele não
    # resolve e `FLIGHT_SOURCE=real` não acha o broker. É preferível ao IP da
    # rede local no .env, que muda quando o DHCP renova.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - appdata:/data
      # Pasta de entrega do modelo. Bind mount, e não volume nomeado, porque o
      # ponto todo é que quem treina copie o arquivo para uma pasta da árvore
      # do projeto — dentro de um volume gerido pelo Docker isso exigiria saber
      # `docker cp`. Ver models/README.md.
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    # Mesmo problema, e aqui era pior: o serviço não tem `env_file`, então as
    # VITE_* do .env nunca chegavam ao Vite. Não se resolve dando o .env
    # inteiro a este container — ele carrega segredo (ROBOFLOW_API_KEY,
    # POSTGRES_PASSWORD) que não tem o que fazer num build de frontend.
    # Repassa-se, uma a uma, só o que é de build-time.
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000/api/v1}"
      # VITE_DRONE_MODEL_URL fica de fora DE PROPÓSITO, apesar de existir no
      # .env. `DroneViewer` liga o modelo 3D com
      # `Boolean(import.meta.env.VITE_DRONE_MODEL_URL)`, e o arquivo apontado
      # ainda não existe (`frontend/public/models/` só tem o README). Repassar
      # hoje trocaria o placeholder por um `useGLTF` de arquivo ausente.
      # Quando o .glb entrar no repositório, acrescente aqui:
      #   VITE_DRONE_MODEL_URL: "${VITE_DRONE_MODEL_URL:-}"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on: [backend]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    volumes:
      - ./docs:/docs/docs
      - ./mkdocs.yml:/docs/mkdocs.yml
      - ./site:/docs/site
    ports:
      - "8001:8000"
    command: mkdocs serve --dev-addr 0.0.0.0:8000

  # Broker RTMP/RTSP entre o FlightHub 2 e o backend.
  # Substitua/aponte para a instância existente em produção.
  mediamtx:
    image: bluenviron/mediamtx:latest
    environment:
      MTX_PROTOCOLS: tcp
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
    ports:
      - "1935:1935"   # RTMP  (publicação vinda do FlightHub)
      - "8554:8554"   # RTSP  (consumo pelo backend)
      - "9997:9997"   # API de status
    profiles: ["stream"]

volumes:
  pgdata:
  appdata:
